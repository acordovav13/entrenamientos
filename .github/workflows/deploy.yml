name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si empujas dos veces seguidas, se despliega la ultima y se cancela la anterior.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Versiones antiguas que se publican en subcarpetas, para poder compararlas con
  # la actual usando el mismo historial. Separadas por espacios. Para dejar de
  # publicar una, se quita de aqui; para sumar otra, se agrega su tag.
  VERSIONES_ANTERIORES: v0.1

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hacen falta los tags para poder compilar las versiones anteriores.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar la version actual
        run: npm run build
        env:
          # GitHub Pages sirve los proyectos desde /<nombre-repo>/, asi que la base
          # se toma del nombre del repositorio y no hay nada que ajustar a mano.
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Compilar las versiones anteriores
        run: |
          set -euo pipefail
          for tag in $VERSIONES_ANTERIORES; do
            echo "::group::Compilando $tag"
            git worktree add "../$tag" "$tag"
            (
              cd "../$tag"
              npm ci
              VITE_BASE="/${{ github.event.repository.name }}/$tag/" npm run build
            )
            cp -r "../$tag/dist" "dist/$tag"
            echo "::endgroup::"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
